<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e1a">
<title>Udyr Matchup Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://ddragon.leagueoflegends.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-0:#070a13;--bg-1:#0d1320;--bg-2:#141c2e;--bg-3:#1c2742;--line:rgba(200,170,110,0.18);--line-strong:rgba(200,170,110,0.42);--gold:#c8aa6e;--gold-bright:#f0e6d2;--gold-deep:#785a28;--hex-blue:#0bc6e3;--danger:#c8443c;--text:#cdbe91;--text-dim:#a09b8c;--text-muted:#5b5a56;--phys:#e08a3c;--magic:#0bc6e3;--true:#f0e6d2;--ok:#3fbf7f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg-0);color:var(--text);font-family:'Inter Tight',sans-serif;font-weight:400;overflow-x:hidden}
body{background:radial-gradient(ellipse at top,rgba(11,198,227,0.06),transparent 50%),radial-gradient(ellipse at bottom,rgba(200,170,110,0.04),transparent 50%),linear-gradient(180deg,var(--bg-0) 0%,var(--bg-1) 100%);min-height:100vh;background-attachment:fixed}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(200,170,110,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(200,170,110,0.025) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%)}
header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(7,10,19,0.97) 0%,rgba(7,10,19,0.85) 100%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 20px}
.brand{display:flex;align-items:center;gap:14px;max-width:1400px;margin:0 auto}
.brand-mark{width:42px;height:42px;flex-shrink:0;background:linear-gradient(135deg,var(--gold-deep),var(--gold));clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;position:relative}
.brand-mark::before{content:'';position:absolute;inset:2px;background:var(--bg-0);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}
.brand-mark span{position:relative;z-index:1;color:var(--gold-bright);font-family:'Cinzel',serif;font-weight:700;font-size:18px}
.brand-text h1{margin:0;font-family:'Cinzel',serif;font-weight:600;font-size:18px;letter-spacing:0.18em;color:var(--gold-bright);text-transform:uppercase}
.brand-text p{margin:0;font-size:11px;color:var(--text-muted);letter-spacing:0.2em;text-transform:uppercase}
.patch-tag{margin-left:8px;font-size:9px;color:var(--text-muted);font-family:'Inter Tight',sans-serif;letter-spacing:0.08em;border:1px solid var(--line);padding:1px 6px}
.header-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn{background:transparent;border:1px solid var(--line);color:var(--text-dim);width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s ease;font-size:14px;flex-shrink:0}
.icon-btn:hover{border-color:var(--gold);color:var(--gold-bright);background:rgba(200,170,110,0.08)}
main{max-width:1400px;margin:0 auto;padding:24px 20px 80px;position:relative;z-index:1}
.selector-wrap,.matchup-view{border:1px solid var(--line);background:linear-gradient(180deg,rgba(20,28,46,0.4),rgba(13,19,32,0.6));padding:24px;position:relative}
.matchup-view{padding:0}
.selector-wrap::before,.selector-wrap::after,.matchup-view::before,.matchup-view::after{content:'';position:absolute;width:14px;height:14px;border:1px solid var(--gold)}
.selector-wrap::before,.matchup-view::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.selector-wrap::after,.matchup-view::after{top:-1px;right:-1px;border-left:none;border-bottom:none}
.corner-bl,.corner-br{position:absolute;width:14px;height:14px;border:1px solid var(--gold)}
.corner-bl{bottom:-1px;left:-1px;border-right:none;border-top:none}
.corner-br{bottom:-1px;right:-1px;border-left:none;border-top:none}
.section-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.32em;color:var(--gold);text-transform:uppercase;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.section-label::before,.section-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line-strong),transparent)}
.section-label::before{max-width:30px}
.search-row{margin-bottom:18px}
.search-input{width:100%;background:rgba(7,10,19,0.6);border:1px solid var(--line);color:var(--gold-bright);padding:12px 16px;font-family:'Inter Tight',sans-serif;font-size:15px;outline:none;letter-spacing:0.04em}
.search-input:focus{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(200,170,110,0.2)}
.search-input::placeholder{color:var(--text-muted);font-style:italic}

/* === iOS-COMPAT GRID === */
.champion-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;max-height:62vh;overflow-y:auto;padding:4px;scrollbar-width:thin;scrollbar-color:var(--gold-deep) transparent}
.champion-grid::-webkit-scrollbar{width:6px}
.champion-grid::-webkit-scrollbar-thumb{background:var(--gold-deep)}
.champion-card{position:relative;cursor:pointer;border:1px solid transparent;transition:all 0.18s ease;background:var(--bg-2);overflow:hidden;width:100%}
.champion-card::before{content:'';display:block;padding-top:100%}
.champion-card img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s}
.champion-card:hover{border-color:var(--gold)}
.champion-card:hover img{transform:scale(1.08)}
.champion-card.has-data{border-color:rgba(11,198,227,0.4)}
.champion-card.has-data .dot{position:absolute;top:3px;right:3px;width:7px;height:7px;background:var(--hex-blue);border-radius:50%;box-shadow:0 0 8px var(--hex-blue);z-index:2}
.champion-card .cname{position:absolute;left:0;right:0;bottom:0;font-size:9px;color:var(--gold-bright);background:linear-gradient(180deg,transparent,rgba(0,0,0,0.92));padding:14px 4px 4px;text-align:center;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}

.matchup-header{display:flex;align-items:center;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(120,90,40,0.12),transparent)}
.matchup-portrait{width:64px;height:64px;flex-shrink:0;border:1px solid var(--gold);position:relative;overflow:hidden}
.matchup-portrait img{width:100%;height:100%;object-fit:cover;display:block}
.matchup-title{flex:1;min-width:0}
.matchup-title h2{margin:0;font-family:'Cinzel',serif;font-weight:600;color:var(--gold-bright);font-size:22px;letter-spacing:0.08em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.matchup-title p{margin:2px 0 0;font-size:11px;color:var(--text-muted);letter-spacing:0.18em;text-transform:uppercase}
.back-btn{background:transparent;border:1px solid var(--line);color:var(--text-dim);padding:8px 14px;cursor:pointer;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;transition:all 0.2s;flex-shrink:0}
.back-btn:hover{border-color:var(--gold);color:var(--gold-bright)}
.tabs-bar{display:flex;align-items:stretch;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tab{background:transparent;border:none;border-right:1px solid var(--line);color:var(--text-dim);padding:12px 20px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;transition:all 0.2s;white-space:nowrap;display:flex;align-items:center;gap:8px;flex-shrink:0;position:relative}
.tab:hover{color:var(--gold-bright);background:rgba(200,170,110,0.05)}
.tab.active{color:var(--gold-bright);background:rgba(200,170,110,0.1)}
.tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--gold)}
.tab .x{opacity:0.5;font-size:14px;line-height:1}
.tab .x:hover{opacity:1;color:var(--danger)}
.tab-add{background:transparent;border:none;color:var(--gold);cursor:pointer;padding:12px 16px;font-size:18px;font-weight:300;line-height:1;transition:all 0.2s}
.tab-add:hover{background:rgba(200,170,110,0.08);color:var(--gold-bright)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:1px;background:var(--line)}
.pane{background:var(--bg-1);padding:20px;min-height:400px;min-width:0}
.pane-switch{display:none}
.subhead{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.32em;color:var(--gold);text-transform:uppercase;margin:0 0 12px}
.rune-tree{margin-bottom:20px}
.tree-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.tree-icon{width:28px;height:28px;cursor:pointer;flex-shrink:0}
.tree-icon img{width:100%;height:100%;display:block}
.tree-icon .placeholder{width:100%;height:100%;border:1px dashed var(--line)}
.tree-name{font-size:13px;color:var(--gold-bright);font-weight:500;letter-spacing:0.06em}
.keystone-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.keystone-slot{width:54px;height:54px;border:1px solid var(--line);cursor:pointer;position:relative;background:var(--bg-2);transition:all 0.2s;overflow:hidden}
.keystone-slot img{width:100%;height:100%;display:block;filter:grayscale(0.5) brightness(0.6)}
.keystone-slot:hover{border-color:var(--gold-deep)}
.keystone-slot:hover img{filter:grayscale(0.2) brightness(0.85)}
.keystone-slot.selected{border-color:var(--gold)}
.keystone-slot.selected img{filter:none}
.keystone-slot.selected::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 12px rgba(200,170,110,0.4);pointer-events:none}
.rune-row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.rune-slot{width:40px;height:40px;border:1px solid var(--line);cursor:pointer;position:relative;background:var(--bg-2);transition:all 0.18s;overflow:hidden}
.rune-slot img{width:100%;height:100%;display:block;filter:grayscale(0.5) brightness(0.55)}
.rune-slot:hover{border-color:var(--gold-deep)}
.rune-slot:hover img{filter:grayscale(0.2) brightness(0.8)}
.rune-slot.selected{border-color:var(--gold);background:var(--bg-3)}
.rune-slot.selected img{filter:none}
.slot-label{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.2em;margin:8px 0 4px}
.spell-row{display:flex;gap:10px;margin-top:6px}
.spell-slot{width:48px;height:48px;border:1px solid var(--line);cursor:pointer;background:var(--bg-2);position:relative;transition:all 0.18s;overflow:hidden}
.spell-slot img{width:100%;height:100%;display:block}
.spell-slot.empty{display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:20px;font-weight:300}
.spell-slot:hover{border-color:var(--gold)}
.spell-slot.selected{border-color:var(--gold)}
.notes-area{width:100%;min-height:180px;background:rgba(7,10,19,0.6);border:1px solid var(--line);color:var(--text);padding:14px 16px;font-family:'Inter Tight',sans-serif;font-size:14px;line-height:1.65;outline:none;resize:vertical}
.notes-area:focus{border-color:var(--gold-deep)}
.notes-area::placeholder{color:var(--text-muted);font-style:italic}
.build-name-input{background:rgba(7,10,19,0.6);border:1px solid var(--line);color:var(--gold-bright);padding:8px 12px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.12em;outline:none;text-transform:uppercase;margin-bottom:16px;width:100%}
.build-name-input:focus{border-color:var(--gold)}

/* === ITEMS === */
.item-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-width:340px}
.item-slot{position:relative;border:1px solid var(--line);background:var(--bg-2);cursor:pointer;overflow:hidden;transition:border-color 0.18s}
.item-slot::before{content:'';display:block;padding-top:100%}
.item-slot img{position:absolute;top:0;left:0;width:100%;height:100%;display:block;object-fit:cover}
.item-slot .plus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:18px;font-weight:300}
.item-slot:hover{border-color:var(--gold)}
.item-slot.filled{border-color:var(--gold-deep)}
.item-names{font-size:11px;color:var(--text-dim);margin-top:6px;line-height:1.5;min-height:16px}
details.extra{margin-top:10px;border:1px solid var(--line);background:rgba(7,10,19,0.35)}
details.extra summary{cursor:pointer;padding:8px 10px;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-dim);list-style:none}
details.extra summary::-webkit-details-marker{display:none}
details.extra summary::before{content:'+ ';color:var(--gold)}
details.extra[open] summary::before{content:'− '}
details.extra .extra-body{padding:4px 10px 12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* === SIM CONTROLS === */
.sim-block{margin-bottom:18px}
.ctl-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 16px}
.ctl label,.mini label{display:flex;justify-content:space-between;align-items:baseline;font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.18em;margin-bottom:4px}
.ctl label b{font-family:'Inter Tight',sans-serif;font-size:15px;font-weight:500;color:var(--gold-bright);letter-spacing:0}
.ctl input[type=range]{width:100%;accent-color:var(--gold);margin:2px 0 0}
.mini input{width:100%;background:rgba(7,10,19,0.6);border:1px solid var(--line);color:var(--gold-bright);padding:6px 8px;font-family:'Inter Tight',sans-serif;font-size:14px;outline:none;font-variant-numeric:tabular-nums}
.mini input:focus{border-color:var(--gold)}
.seg{display:flex;border:1px solid var(--line);flex-wrap:nowrap}
.seg button{flex:1;min-width:0;background:transparent;border:none;border-right:1px solid var(--line);color:var(--text-dim);padding:7px 2px;line-height:1.2;font-family:'Inter Tight',sans-serif;font-size:12px;cursor:pointer;transition:all 0.15s}
.seg button:last-child{border-right:none}
.seg button.on{background:rgba(200,170,110,0.16);color:var(--gold-bright);box-shadow:inset 0 -2px 0 var(--gold)}
.seg button:disabled{color:var(--text-muted);opacity:0.35;cursor:not-allowed}
.rank-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 16px}
.hint{font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.5}
.hint.warn{color:#d9a35b}
.rune-box{border:1px solid var(--line);background:linear-gradient(90deg,rgba(120,90,40,0.1),transparent);padding:12px}
.rune-box .rb-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:var(--gold-bright)}
.rune-box .rb-head img{width:22px;height:22px}
.src-tag{display:inline-block;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;border:1px solid var(--line);padding:2px 6px;color:var(--text-dim);margin-left:6px;vertical-align:middle}
.src-tag.wiki{border-color:rgba(11,198,227,0.45);color:var(--hex-blue)}

/* === STATS === */
.vs-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.stat-card{border:1px solid var(--line);background:rgba(7,10,19,0.45);padding:10px 12px}
.stat-card h4{margin:0 0 8px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.22em;color:var(--gold);text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:6px}
.stat-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.stat-card dt{color:var(--text-muted)}
.stat-card dd{margin:0;text-align:right;color:var(--gold-bright);font-variant-numeric:tabular-nums}
.stat-card dd small{color:var(--text-dim);font-size:10px}

/* === DAMAGE ROWS === */
.legend{display:flex;gap:14px;font-size:10px;color:var(--text-dim);letter-spacing:0.12em;text-transform:uppercase;margin:0 0 6px;flex-wrap:wrap}
.legend span::before{content:'';display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:middle}
.legend .p::before{background:var(--phys)}.legend .m::before{background:var(--magic)}.legend .t::before{background:var(--true)}
.dmg-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.dmg-row.off{opacity:0.4}
.dmg-name{color:var(--gold-bright);font-size:13px;font-weight:500;letter-spacing:0.02em}
.dmg-sub{font-size:11px;color:var(--text-dim);margin-top:3px;line-height:1.5;font-variant-numeric:tabular-nums}
.dmg-val{text-align:right;font-variant-numeric:tabular-nums}
.dmg-val .big{font-size:21px;color:var(--gold-bright);line-height:1.1}
.dmg-val .pct{font-size:10px;color:var(--text-muted);letter-spacing:0.06em}
.dmg-bar{grid-column:1/-1;height:4px;background:rgba(255,255,255,0.05);display:flex;overflow:hidden}
.dmg-bar i{display:block;height:100%}
.stepper{display:flex;align-items:center;border:1px solid var(--line)}
.stepper button{background:transparent;border:none;color:var(--text-dim);width:26px;height:28px;cursor:pointer;font-size:15px;line-height:1}
.stepper button:hover{color:var(--gold-bright)}
.stepper span{min-width:22px;text-align:center;font-size:12px;color:var(--gold-bright);font-variant-numeric:tabular-nums}
.sum-card{margin-top:14px;border:1px solid var(--line-strong);padding:12px 14px;background:rgba(7,10,19,0.5)}
.sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sum-top .v{font-size:22px;color:var(--gold-bright);font-variant-numeric:tabular-nums}
.sum-top .verdict{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase}
.verdict.kill{color:var(--ok)}.verdict.nokill{color:var(--danger)}
.hpbar{position:relative;height:12px;margin-top:8px;background:rgba(200,68,60,0.18);border:1px solid var(--line);overflow:hidden;display:flex}
.hpbar i{display:block;height:100%}
.sum-reset{background:transparent;border:1px solid var(--line);color:var(--text-dim);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;padding:4px 8px;cursor:pointer}
.sum-reset:hover{color:var(--gold-bright);border-color:var(--gold)}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal-card{background:var(--bg-1);border:1px solid var(--gold-deep);max-width:520px;width:100%;max-height:80vh;display:flex;flex-direction:column;position:relative}
.modal-card.wide{max-width:680px}
.modal-card::before,.modal-card::after{content:'';position:absolute;width:14px;height:14px;border:1px solid var(--gold)}
.modal-card::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.modal-card::after{bottom:-1px;right:-1px;border-left:none;border-top:none}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.modal-head h3{margin:0;font-family:'Cinzel',serif;font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold-bright);margin-right:auto}
.modal-search{padding:12px 16px 0}
.modal-search input{padding:9px 12px;font-size:14px}
.modal-body{padding:16px;overflow-y:auto;flex:1}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.picker-grid.items{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
.picker-item{position:relative;border:1px solid var(--line);cursor:pointer;background:var(--bg-2);transition:all 0.18s;overflow:hidden;width:100%}
.picker-item::before{content:'';display:block;padding-top:100%}
.picker-item img{position:absolute;top:0;left:0;width:100%;height:100%;display:block;object-fit:cover}
.picker-item .lbl{position:absolute;left:0;right:0;bottom:0;font-size:8px;line-height:1.2;color:var(--gold-bright);background:linear-gradient(180deg,transparent,rgba(0,0,0,0.92));padding:12px 3px 3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-item:hover{border-color:var(--gold);transform:scale(1.05)}
.picker-group{font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-muted);margin:14px 0 6px}
.picker-group:first-child{margin-top:0}

/* ================= UDYR / RÜN SABİTLERİ (LoL Wiki, Udyr V26.09) ================= */
const UDYR_FALLBACK={hp_base:664,hp_lvl:92,arm_base:31,arm_lvl:4.7,mr_base:32,mr_lvl:2.05,dam_base:62,dam_lvl:4,as_base:0.65,as_lvl:3,patch:'V26.09'};

const Q_PCT=[.03,.04,.05,.06,.07,.08];          // pençe vuruşu %max can (+%3,5 / 100 bonus AD)

const ROW_NAMES={aa:'Düz auto',claw:'Q pençe vuruşu',onhit:'Q on-hit auto',qa:'Q✦ awaken vuruşu',bolt:'Tek yıldırım',ron:'R güçlü vuruş',rtick:'R fırtına tiki',ratick:'R✦ fırtına tiki',ign:'Tutuşturma'};

const GROW=(b,g,L)=>b+g*(L-1)*(0.7025+0.0175*(L-1));     // Riot stat büyümesi
const SCALE=(lo,hi,L)=>lo+(hi-lo)/17*(L-1)*(0.7025+0.0175*(L-1)); // "seviyeye göre" aralıklar

const STORAGE_KEY='udyr-codex-v3';
const WIKI_CACHE_KEY='udyr-codex-wikistats-v1';
function eachBuild(d,fn){Object.keys(d||{}).forEach(k=>{if(k!=='__deleted'&&d[k]&&Array.isArray(d[k].builds))d[k].builds.forEach(b=>b&&fn(b,k))})}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function escapeHtml(s){if(s==null)return '';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function fetchJSON(url,opts){
  const res=await fetch(url,opts);
  if(!res.ok)throw new Error('HTTP '+res.status);
  return res.json();
}
async function fetchLocale(version,file){

  catch(e){return await fetchJSON(`${CDN}/${version}/data/en_US/${file}`)}
}

/* ================= LUA (Module:ChampionData/data) PARSER ================= */
function parseLua(src){
  let i=0;const n=src.length;
  const isWS=c=>c===' '||c==='\n'||c==='\t'||c==='\r';
  function ws(){
    for(;;){
      while(i<n&&isWS(src[i]))i++;
      if(src[i]==='-'&&src[i+1]==='-'){
        const m=/^--\[(=*)\[/.exec(src.slice(i,i+12));
        if(m){const close=']'+m[1]+']';const e=src.indexOf(close,i+m[0].length);i=e<0?n:e+close.length;}
        else{const e=src.indexOf('\n',i);i=e<0?n:e+1;}
        continue;
      }
      break;
    }
  }
  function str(){
    const q=src[i++];let s='';
    while(i<n&&src[i]!==q){
      if(src[i]==='\\'){i++;const c=src[i++];s+=c==='n'?'\n':c==='t'?'\t':c;}
      else s+=src[i++];
    }
    i++;return s;
  }
  function longStr(){
    const m=/^\[(=*)\[/.exec(src.slice(i,i+12));const close=']'+m[1]+']';
    const st=i+m[0].length;const e=src.indexOf(close,st);i=e+close.length;return src.slice(st,e);
  }
  function num(){
    const m=/^-?\s*(0x[0-9a-fA-F]+|\d*\.?\d+(?:[eE][-+]?\d+)?)/.exec(src.slice(i,i+40));
    if(!m)throw new Error('Lua sayı hatası @'+i);
    i+=m[0].length;return Number(m[0].replace(/\s/g,''));
  }
  function val(){
    ws();const c=src[i];
    if(c==='{')return table();
    if(c==='"'||c==="'")return str();
    if(c==='['&&/^\[=*\[/.test(src.slice(i,i+12)))return longStr();
    if(c==='-'||c==='.'||(c>='0'&&c<='9'))return num();
    const m=/^[A-Za-z_]\w*/.exec(src.slice(i,i+64));
    if(m){i+=m[0].length;if(m[0]==='true')return true;if(m[0]==='false')return false;if(m[0]==='nil')return null;return m[0];}
    throw new Error('Lua ayrıştırma hatası @'+i);
  }
  function table(){
    i++;const obj={};let arr=1;
    for(;;){
      ws();
      if(i>=n)throw new Error('Lua tablo sonu yok');
      if(src[i]==='}'){i++;break;}
      let key;
      if(src[i]==='['&&!/^\[=*\[/.test(src.slice(i,i+12))){
        i++;key=val();ws();i++;ws();i++; // ] =
      }else{
        const m=/^([A-Za-z_]\w*)\s*=(?!=)/.exec(src.slice(i,i+80));
        if(m){key=m[1];i+=m[0].length;}
      }
      const v=val();
      if(key===undefined)key=arr++;
      obj[key]=v;ws();
      if(src[i]===','||src[i]===';')i++;
    }
    return obj;
  }
  const m=/(^|\n)\s*return\s*\{/.exec(src);
  if(!m)throw new Error('return { bulunamadı');
  i=m.index+m[0].length-1;
  return table();
}

function normStats(s,patch){
  const num=v=>typeof v==='number'?v:parseFloat(v);
  const o={hp_base:num(s.hp_base),hp_lvl:num(s.hp_lvl),arm_base:num(s.arm_base),arm_lvl:num(s.arm_lvl),
    mr_base:num(s.mr_base),mr_lvl:num(s.mr_lvl),dam_base:num(s.dam_base),dam_lvl:num(s.dam_lvl),
    as_base:num(s.as_base),as_lvl:num(s.as_lvl),patch:patch||''};
  return ['hp_base','arm_base','mr_base','dam_base'].every(k=>isFinite(o[k]))?o:null;
}
function wikiToStats(data){
  const out={};
  const byApi={},byKey={};
  state.champions.forEach(c=>{byApi[c.id.toLowerCase()]=c.id;byKey[String(c.key)]=c.id});
  const entries=Object.entries(data).filter(([,d])=>d&&typeof d==='object'&&d.stats);
  for(const [name,d] of entries){
    const api=(d.apiname||'').toLowerCase();
    const id=byApi[api];if(!id||out[id])continue;
    const st=normStats(d.stats,d.patch);if(st)out[id]=st;
  }
  for(const [name,d] of entries){
    const id=byKey[String(d.id)];if(!id||out[id])continue;
    const c=championMap[id];
    if(c&&name!==c.name&&name!==c.id)continue;
    const st=normStats(d.stats,d.patch);if(st)out[id]=st;
  }
  return out;
}
async function loadWikiStats(){
  try{
    const cached=JSON.parse(localStorage.getItem(WIKI_CACHE_KEY)||'null');
    if(cached&&cached.stats&&Date.now()-cached.t<3*864e5&&cached.dd===DD_VERSION){
      state.wikiStats=cached.stats;state.statSource='wiki';return;
    }
  }catch(e){}
  try{
    const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),15000);
    const j=await fetchJSON(WIKI_API,{signal:ctrl.signal});clearTimeout(to);
    const page=Array.isArray(j.query.pages)?j.query.pages[0]:Object.values(j.query.pages)[0];
    const rev=page.revisions[0];
    const content=rev.slots?(rev.slots.main.content!=null?rev.slots.main.content:rev.slots.main['*']):(rev.content!=null?rev.content:rev['*']);
    const stats=wikiToStats(parseLua(content));
    if(Object.keys(stats).length<50)throw new Error('Wiki verisi eksik ('+Object.keys(stats).length+')');
    state.wikiStats=stats;state.statSource='wiki';
    try{localStorage.setItem(WIKI_CACHE_KEY,JSON.stringify({t:Date.now(),dd:DD_VERSION,stats}))}catch(e){}
  }catch(e){
    console.warn('Wiki stat çekilemedi, Data Dragon kullanılıyor:',e);
    state.statSource='ddragon';
  }
}
function champStats(id){
  if(state.wikiStats[id])return Object.assign({src:'wiki'},state.wikiStats[id]);
  if(state.ddStats[id])return Object.assign({src:'ddragon'},state.ddStats[id]);
  if(id==='Udyr')return Object.assign({src:'sabit'},UDYR_FALLBACK);
  return null;
}

/* ================= ITEMLER ================= */
const ITEM_LABELS={'attack damage':'ad','ability power':'ap','health':'hp','armor':'arm','magic resist':'mr','lethality':'leth','armor penetration':'apen','magic penetration':'mpen','attack speed':'as','ability haste':'ah','critical strike chance':'crit'};
function parseItemStats(en){
  const st={};
  const m=(en.description||'').match(/<stats>([\s\S]*?)<\/stats>/i);
  if(m){
    m[1].split(/<br\s*\/?>/i).forEach(line=>{
      const t=line.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      const mm=t.match(/^([\d.,]+)\s*(%?)\s+(.+)$/);if(!mm)return;
      const key=ITEM_LABELS[mm[3].trim().toLowerCase()];if(!key)return;
      const v=parseFloat(mm[1].replace(',','.'));if(!isFinite(v))return;
      if(key==='mpen'&&mm[2])st.mpenPct=(st.mpenPct||0)+v;
      else st[key]=(st[key]||0)+v;
    });
  }
  const s=en.stats||{};
  if(st.ad==null&&s.FlatPhysicalDamageMod)st.ad=s.FlatPhysicalDamageMod;
  if(st.ap==null&&s.FlatMagicDamageMod)st.ap=s.FlatMagicDamageMod;
  if(st.hp==null&&s.FlatHPPoolMod)st.hp=s.FlatHPPoolMod;
  if(st.arm==null&&s.FlatArmorMod)st.arm=s.FlatArmorMod;
  if(st.mr==null&&s.FlatSpellBlockMod)st.mr=s.FlatSpellBlockMod;
  if(st.as==null&&s.PercentAttackSpeedMod)st.as=s.PercentAttackSpeedMod*100;
  return st;
}
function buildItems(enJson,trJson){
  const seen=new Set();const out=[];
  for(const [id,it] of Object.entries(enJson.data)){
    if(!it.maps||!it.maps['11'])continue;
    if(!it.gold||!it.gold.purchasable||it.gold.total<=0)continue;
    if(it.inStore===false||it.requiredChampion||it.requiredAlly||it.hideFromAll)continue;
    const tags=it.tags||[];
    if(tags.includes('Consumable')||tags.includes('Trinket'))continue;
    const stats=parseItemStats(it);
    if(!['ad','ap','hp','arm','mr','leth','apen','mpen','mpenPct','as'].some(k=>stats[k]))continue;
    if(seen.has(it.name))continue;seen.add(it.name);
    const tr=trJson&&trJson.data[id];
    const hasFrom=!!(it.from&&it.from.length),hasInto=!!(it.into&&it.into.length);
    const tier=tags.includes('Boots')?'boots':(!hasFrom&&!hasInto)?(it.gold.total<=1000?'starter':'legendary'):!hasFrom?'basic':hasInto?'epic':'legendary';
    out.push({id,name:(tr&&tr.name)||it.name,enName:it.name,gold:it.gold.total,img:it.image.full,stats,tier});
  }
  out.sort((a,b)=>a.gold-b.gold||a.name.localeCompare(b.name,'tr'));
  return out;
}
function sumItems(ids){
  const t={ad:0,ap:0,hp:0,arm:0,mr:0,leth:0,mpen:0,as:0};let keepA=1,keepM=1;
  (ids||[]).forEach(id=>{
    const it=itemMap[id];if(!it)return;const s=it.stats;
    ['ad','ap','hp','arm','mr','leth','mpen','as'].forEach(k=>{if(s[k])t[k]+=s[k]});
    if(s.apen)keepA*=1-s.apen/100;
    if(s.mpenPct)keepM*=1-s.mpenPct/100;
  });
  t.apenF=1-keepA;t.mpenF=1-keepM;return t;
}
function itemStatText(s){
  const p=[];
  if(s.ad)p.push(s.ad+' AD');if(s.ap)p.push(s.ap+' AP');if(s.hp)p.push(s.hp+' can');
  if(s.arm)p.push(s.arm+' zırh');if(s.mr)p.push(s.mr+' MR');if(s.leth)p.push(s.leth+' ölümcüllük');
  if(s.apen)p.push('%'+s.apen+' zırh delme');if(s.mpen)p.push(s.mpen+' büyü delme');if(s.mpenPct)p.push('%'+s.mpenPct+' büyü delme');
  if(s.as)p.push('%'+s.as+' AS');
  return p.join(', ');
}

/* ================= BOOTSTRAP ================= */
async function bootstrap(){
  loadData();
  loadSyncCfg();setSync(sync.token?'busy':'off');
  try{
    const versions=await fetchJSON('https://ddragon.leagueoflegends.com/api/versions.json');
    DD_VERSION=versions[0];
    document.getElementById('patchTag').textContent=DD_VERSION;
    const [champJson,spellJson,runeJson,itemEn,itemTr]=await Promise.all([
      fetchLocale(DD_VERSION,'champion.json'),
      fetchLocale(DD_VERSION,'summoner.json'),
      fetchLocale(DD_VERSION,'runesReforged.json'),
      fetchJSON(`${CDN}/${DD_VERSION}/data/en_US/item.json`).catch(()=>null),
      fetchJSON(`${CDN}/${DD_VERSION}/data/tr_TR/item.json`).catch(()=>null)
    ]);
    state.champions=Object.values(champJson.data).map(c=>({id:c.id,name:c.name,key:c.key})).sort((a,b)=>a.name.localeCompare(b.name,'tr'));
    state.champions.forEach(c=>championMap[c.id]=c);
    Object.values(champJson.data).forEach(c=>{
      const s=c.stats;if(!s)return;
      state.ddStats[c.id]=normStats({hp_base:s.hp,hp_lvl:s.hpperlevel,arm_base:s.armor,arm_lvl:s.armorperlevel,mr_base:s.spellblock,mr_lvl:s.spellblockperlevel,dam_base:s.attackdamage,dam_lvl:s.attackdamageperlevel,as_base:s.attackspeed,as_lvl:s.attackspeedperlevel},'');
    });
    state.spells=Object.values(spellJson.data).filter(s=>s.modes&&s.modes.includes('CLASSIC')).map(s=>({id:s.id,name:s.name,img:s.image.full})).sort((a,b)=>a.name.localeCompare(b.name,'tr'));
    state.spells.forEach(s=>spellMap[s.id]=s);
    state.runeTrees=runeJson.map(t=>({id:t.id,key:t.key,name:t.name,icon:t.icon,slots:t.slots.map(sl=>({runes:sl.runes.map(r=>({id:r.id,name:r.name,icon:r.icon}))}))}));
    state.runeTrees.forEach(t=>{treeMap[t.id]=t;t.slots.forEach(sl=>sl.runes.forEach(r=>runeMap[r.id]={...r,treeId:t.id}))});
    if(itemEn){state.items=buildItems(itemEn,itemTr);state.items.forEach(it=>itemMap[it.id]=it);}
    renderSelection();
    if(sync.token){setSync('busy');syncNow();}
    loadWikiStats().then(()=>{if(state.currentChampion)renderSim();});
  }catch(e){
    console.error(e);
    document.getElementById('app').innerHTML=`<div class="loader"><div class="loader-text" style="color:var(--danger)">Bağlantı Hatası</div><div style="color:var(--text-dim);font-size:13px;text-align:center;max-width:400px;line-height:1.6">${escapeHtml(e.message)}<br><br>İnternet bağlantını kontrol et veya birkaç saniye sonra sayfayı yenile.</div><button class="back-btn" onclick="location.reload()">↻ Yeniden Dene</button></div>`;
  }
}

/* ================= BUILD VERİSİ ================= */
function ensureChampData(id){
  if(!state.data[id])state.data[id]={builds:[]};
  if(state.data[id].builds.length===0)state.data[id].builds.push(makeEmptyBuild('Build 1'));
  state.data[id].builds.forEach(ensureBuild);
  return state.data[id];
}
function makeEmptyBuild(name){
  return ensureBuild({id:'b_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),name,
    primary:{treeId:null,keystone:null,slot1:null,slot2:null,slot3:null},
    sub:{treeId:null,slot1:null,slot2:null},shards:[null,null,null],spells:[null,null],notes:'',u:0});
}
function ensureBuild(b){
  if(b.u==null)b.u=0;
  const def={myLv:9,enLv:9,qr:-1,rr:1,items:null,enItems:[null,null,null,null,null,null],my:{ad:0,ap:0,hp:0},en:{hp:0,arm:0,mr:0},
    conqOn:true,conq:12,adapt:'auto',shards:0,third:'none',ign:false,selfHp:100,enHp:100,strikes:6,counts:{}};
  b.sim=Object.assign({},def,b.sim||{});
  if(!Array.isArray(b.sim.items))b.sim.items=Array.isArray(b.items)?b.items.slice(0,6):[null,null,null,null,null,null];
  delete b.items;
  b.sim.my=Object.assign({},def.my,b.sim.my||{});
  b.sim.en=Object.assign({},def.en,b.sim.en||{});
  if(!Array.isArray(b.sim.enItems))b.sim.enItems=def.enItems.slice();
  if(!b.sim.counts||typeof b.sim.counts!=='object')b.sim.counts={};
  return b;
}
function openMatchup(champId){state.currentChampion=champId;state.currentBuildIdx=0;ensureChampData(champId);renderMatchup()}
function currentBuild(){const d=state.data[state.currentChampion];return d&&d.builds[state.currentBuildIdx]}

          <input class="build-name-input" id="buildName" value="${escapeHtml(build.name)}" placeholder="Build adı">
          <h3 class="subhead">Rünler</h3>
          ${renderRuneTree('primary',build.primary)}
          <div style="height:8px"></div>

        </div>

    const sw=document.getElementById('paneSwitch');if(sw.getBoundingClientRect().top<72)window.scrollTo(0,sw.offsetTop+document.querySelector('.matchup-view').offsetTop-72);
  });
  document.getElementById('tabsBar').addEventListener('click',e=>{
    const delBtn=e.target.closest('.x');
    if(delBtn){e.stopPropagation();const idx=+delBtn.dataset.del;
      if(confirm(`"${champData.builds[idx].name}" silinsin mi?`)){
        state.data.__deleted[champData.builds[idx].id]=Date.now();
        champData.builds.splice(idx,1);
        if(state.currentBuildIdx>=champData.builds.length)state.currentBuildIdx=champData.builds.length-1;
        saveData();renderMatchup();}return;}
    const tab=e.target.closest('.tab');
    if(tab){state.currentBuildIdx=+tab.dataset.idx;renderMatchup();}
  });
  document.getElementById('addTabBtn').addEventListener('click',()=>{

  document.getElementById('buildName').addEventListener('input',e=>{build.name=e.target.value||'Adsız Build';saveSoon();});
  document.getElementById('notesArea').addEventListener('input',e=>{build.notes=e.target.value;saveSoon();});

function renderRuneTree(type,treeState){
  const tree=treeState.treeId?treeMap[treeState.treeId]:null;
  const isPrimary=type==='primary';
  return `
    <div class="rune-tree" data-tree-type="${type}">
      <div class="tree-header">
        <div class="tree-icon" data-action="pick-tree" data-type="${type}">
          ${tree?`<img src="${CDN}/img/${tree.icon}" alt="${escapeHtml(tree.name)}">`:'<div class="placeholder"></div>'}
        </div>
        <div class="tree-name">${tree?escapeHtml(tree.name):(isPrimary?'Ana Yol — seçmek için tıkla':'Yan Yol — seçmek için tıkla')}</div>
      </div>
      ${tree?renderTreeSlots(type,tree,treeState):''}
    </div>`;
}
function renderTreeSlots(type,tree,treeState){
  if(type==='primary'){
    return `<div class="keystone-row">${renderRuneSlots(tree.slots[0].runes,treeState.keystone,type,'keystone',true)}</div>
      ${[1,2,3].map(i=>`<div class="rune-row">${renderRuneSlots(tree.slots[i].runes,treeState['slot'+i],type,'slot'+i,false)}</div>`).join('')}`;
  } else {
    const selectedIds=[treeState.slot1,treeState.slot2].filter(x=>x!=null);
    return [1,2,3].map(i=>{
      const rowRunes=tree.slots[i].runes;
      const selInRow=rowRunes.find(r=>selectedIds.includes(r.id));
      return `<div class="rune-row">${renderRuneSlots(rowRunes,selInRow?selInRow.id:null,type,'slot'+i,false)}</div>`;
    }).join('');
  }
}
function renderRuneSlots(runes,selectedId,type,slotKey,big){
  const cls=big?'keystone-slot':'rune-slot';
  return runes.map(r=>`
    <div class="${cls} ${selectedId===r.id?'selected':''}" data-rune-id="${r.id}" data-type="${type}" data-slot="${slotKey}" title="${escapeHtml(r.name)}">
      <img src="${CDN}/img/${r.icon}" alt="${escapeHtml(r.name)}" onerror="this.style.opacity=0.2">
    </div>`).join('');
}
function attachRuneHandlers(build){
  document.querySelectorAll('[data-action="pick-tree"]').forEach(el=>el.addEventListener('click',()=>openTreePicker(el.dataset.type,build)));
  document.querySelectorAll('.keystone-slot, .rune-slot[data-rune-id]').forEach(el=>{
    el.addEventListener('click',()=>{
      const type=el.dataset.type;const slot=el.dataset.slot;const runeId=+el.dataset.runeId;
      const target=build[type];
      if(type==='primary'){
        target[slot]=target[slot]===runeId?null:runeId;
      } else {
        const tree=treeMap[target.treeId];
        const slotRowIdx=tree.slots.findIndex(sl=>sl.runes.some(r=>r.id===runeId));
        const rowRuneIds=tree.slots[slotRowIdx].runes.map(r=>r.id);
        const cur1=target.slot1,cur2=target.slot2;
        if(cur1===runeId){target.slot1=null;}
        else if(cur2===runeId){target.slot2=null;}
        else{
          if(cur1&&rowRuneIds.includes(cur1))target.slot1=runeId;
          else if(cur2&&rowRuneIds.includes(cur2))target.slot2=runeId;
          else if(!cur1)target.slot1=runeId;
          else if(!cur2)target.slot2=runeId;
          else target.slot1=runeId;
        }
      }
      saveData();renderMatchup();
    });
  });
}
function openTreePicker(type,build){
  state.picker={
    title:type==='primary'?'Ana Yol Seç':'Yan Yol Seç',
    items:state.runeTrees.map(t=>({id:t.id,img:`${CDN}/img/${t.icon}`,name:t.name})),
    onPick:(treeId)=>{
      const other=type==='primary'?build.sub:build.primary;
      if(other.treeId===treeId){toast('Aynı ağaç iki tarafta olamaz');return;}
      build[type].treeId=treeId;
      if(type==='primary'){build.primary.keystone=null;build.primary.slot1=null;build.primary.slot2=null;build.primary.slot3=null;}
      else{build.sub.slot1=null;build.sub.slot2=null;}
      closePicker();saveData();renderMatchup();
    }
  };
  renderPicker();
}
function renderShards(shards){
  return SHARDS.rows.map((row,i)=>`
    <div>
      <div class="slot-label">${row.label}</div>
      <div class="rune-row" data-shard-row="${i}">
        ${row.items.map((s,j)=>`
          <div class="rune-slot ${shards[i]===j?'selected':''}" data-shard-row="${i}" data-shard-col="${j}" title="${escapeHtml(s.name)}">
            <img src="${CDN}/img/${s.icon}" alt="${escapeHtml(s.name)}" onerror="this.style.opacity=0.2">
          </div>`).join('')}
      </div>
    </div>`).join('');
}
function attachShardHandlers(build){
  document.querySelectorAll('[data-shard-col]').forEach(el=>{
    el.addEventListener('click',()=>{
      const row=+el.dataset.shardRow;const col=+el.dataset.shardCol;
      build.shards[row]=build.shards[row]===col?null:col;
      saveData();renderMatchup();
    });
  });
}
function renderSpellSlot(spellId,idx){
  if(!spellId)return `<div class="spell-slot empty" data-spell-idx="${idx}">+</div>`;
  const sp=spellMap[spellId];
  if(!sp)return `<div class="spell-slot empty" data-spell-idx="${idx}">+</div>`;
  return `<div class="spell-slot selected" data-spell-idx="${idx}" title="${escapeHtml(sp.name)}">
    <img src="${CDN}/${DD_VERSION}/img/spell/${sp.img}" alt="${escapeHtml(sp.name)}" onerror="this.style.opacity=0.2">
  </div>`;
}
function attachSpellHandlers(build){
  document.querySelectorAll('[data-spell-idx]').forEach(el=>el.addEventListener('click',()=>openSpellPicker(+el.dataset.spellIdx,build)));
}
function openSpellPicker(idx,build){
  state.picker={
    title:'Sihirdar Büyüsü Seç',
    items:state.spells.map(s=>({id:s.id,img:`${CDN}/${DD_VERSION}/img/spell/${s.img}`,name:s.name})),
    onPick:(spellId)=>{
      const otherIdx=idx===0?1:0;
      if(build.spells[otherIdx]===spellId)build.spells[otherIdx]=null;
      build.spells[idx]=build.spells[idx]===spellId?null:spellId;
      closePicker();saveData();renderMatchup();
    }
  };
  renderPicker();
}

/* ---- küçük sayı girişleri (ek statlar) ---- */
function miniInput(path,label,val){
  return `<div class="mini"><label>${label}</label><input type="number" inputmode="decimal" data-path="${path}" value="${val||0}" step="1"></div>`;
}
function getPath(o,p){return p.split('.').reduce((a,k)=>a&&a[k],o)}
function setPath(o,p,v){const ks=p.split('.');const last=ks.pop();ks.reduce((a,k)=>a[k],o)[last]=v}
function attachMiniInputs(root,build,after){
  root.querySelectorAll('.mini input[data-path]').forEach(inp=>inp.addEventListener('input',()=>{
    const v=parseFloat(inp.value);setPath(build.sim,inp.dataset.path,isFinite(v)?v:0);saveSoon();after();
  }));
}

/* ================= SİMÜLASYON ================= */
function hasRune(build,id){
  const p=build.primary,s=build.sub;
  return [p.keystone,p.slot1,p.slot2,p.slot3,s.slot1,s.slot2].includes(id);
}
function rankCap(L){return clamp(Math.floor((L+1)/2),1,6)}

function compute(build,champId){
  const S=build.sim,L=clamp(S.myLv,1,18),EL=clamp(S.enLv,1,18);
  const us=champStats('Udyr'),es=champStats(champId);
  if(!es)return null;
  const it=sumItems(S.items),eit=sumItems(S.enItems);
  const adaptN=clamp(S.shards|0,0,2);
  const isAP=S.adapt==='ap'||(S.adapt==='auto'&&(it.ap+S.my.ap)>(it.ad+S.my.ad));
  const conqOn=!!S.conqOn;
  const stacks=conqOn?clamp(S.conq,0,12):0;
  const conqPer=isAP?LERP(1.8,4.26,L):LERP(1.08,2.56,L);
  const conqAD=isAP?0:stacks*conqPer,conqAP=isAP?stacks*conqPer:0;
  const shardAD=isAP?0:adaptN*5.4,shardAP=isAP?adaptN*9:0;

  const baseAD=GROW(us.dam_base,us.dam_lvl,L);
  const bAD=it.ad+S.my.ad+shardAD+conqAD,AD=baseAD+bAD;
  const AP=it.ap+S.my.ap+shardAP+conqAP;
  const bHP=it.hp+S.my.hp,HP=GROW(us.hp_base,us.hp_lvl,L)+bHP;

  // rakip
  const eHP=GROW(es.hp_base,es.hp_lvl,EL)+eit.hp+S.en.hp;
  const eArm=GROW(es.arm_base,es.arm_lvl,EL)+eit.arm+S.en.arm;
  const eMR=GROW(es.mr_base,es.mr_lvl,EL)+eit.mr+S.en.mr;
  const eff=(R,pct,flat)=>R<=0?R:Math.max(0,R*(1-pct)-flat);
  const effA=eff(eArm,it.apenF,it.leth),effM=eff(eMR,it.mpenF,it.mpen);
  const mult=r=>r>=0?100/(100+r):2-100/(100-r);
  const fA=mult(effA),fM=mult(effM);

  // rün çarpanı (3. satır)
  let amp=0;const ampNotes=[];
  if(S.third==='ls'){const h=S.selfHp;const a=h>=60?0:h<=30?.11:.05+(60-h)/30*.06;amp+=a;ampNotes.push(`Last Stand +${pctf(a)}`);}
  if(S.third==='cdg'){const a=S.enHp<40?.08:0;amp+=a;ampNotes.push(`Coup de Grace +${pctf(a)}`);}
  if(S.third==='cut'){const a=S.enHp>60?.08:0;amp+=a;ampNotes.push(`Cut Down +${pctf(a)}`);}

  // ranklar
  const cap=rankCap(L);
  const qr=S.qr<0?cap:clamp(S.qr,0,cap),rr=clamp(S.rr,0,cap);
  const qi=Math.max(0,qr-1),ri=Math.max(0,rr-1);

  // ham parçalar
  const onhit=Q_ON[qi]+0.2*bAD+Q_BHP[qi]*bHP;
  const clawPct=Q_PCT[qi]+0.035*bAD/100;
  const awPct=SCALE(.02,.0424,L)+0.015*bAD/100+0.001*bHP/100;
  const boltPct=SCALE(.015,.0318,L)+0.006*AP/100;
  const rOn=SCALE(10,43.53,L)+0.35*AP;
  const rTick=R_TICK[ri]+0.175*AP;
  const raPct=SCALE(.01,.0184,L)+0.004375*AP/100;
  const strikes=clamp(S.strikes,0,6);
  const ignOn=!!S.ign;
  const ignTotal=L<=5?70+20*(L-1):150+25*(L-5);

  const P=v=>({t:'p',raw:v}),M=v=>({t:'m',raw:v}),T=v=>({t:'t',raw:v});
  const rows=[
    {k:'aa',parts:[P(AD)],sub:`${nf0.format(AD)} AD`},
    {k:'claw',off:qr<1,parts:[P(AD),P(onhit),P(clawPct*eHP)],
      sub:`AD ${nf0.format(AD)} + on-hit ${nf0.format(onhit)} + ${pctf(clawPct)} max can (${nf0.format(clawPct*eHP)})`},
    {k:'onhit',off:qr<1,parts:[P(AD),P(onhit)],sub:`AD ${nf0.format(AD)} + on-hit ${nf0.format(onhit)} · Q'dan sonraki 4 sn`},
    {k:'qa',off:qr<1,parts:[P(AD),P(onhit),P(clawPct*eHP),P(awPct*eHP),M(strikes*boltPct*eHP)],
      sub:`Pençe + awaken ${pctf(awPct)} max can (${nf0.format(awPct*eHP)}) + ${strikes} yıldırım (${nf0.format(strikes*boltPct*eHP)} büyü)`},
    {k:'bolt',off:qr<1,parts:[M(boltPct*eHP)],sub:`${pctf(boltPct)} max can büyü`},
    {k:'ron',off:rr<1,parts:[P(AD),M(rOn)],sub:`AD ${nf0.format(AD)} + ${nf0.format(rOn)} büyü`},
    {k:'rtick',off:rr<1,parts:[M(rTick)],sub:`0,5 sn'de bir · 4 sn'de 8 tik`,total:8},
    {k:'ratick',off:rr<1,parts:[M(rTick),M(raPct*eHP)],sub:`Tik ${nf0.format(rTick)} + ${pctf(raPct)} max can (${nf0.format(raPct*eHP)}) · 8 tik`,total:8},
  ];
  if(ignOn)rows.push({k:'ign',parts:[T(ignTotal)],sub:`5 sn boyunca, gerçek hasar`});
  rows.forEach(r=>{
    r.name=ROW_NAMES[r.k];
    let p=0,m=0,t=0;
    r.parts.forEach(x=>{if(x.t==='p')p+=x.raw*fA;else if(x.t==='m')m+=x.raw*fM;else t+=x.raw;});
    r.p=p*(1+amp);r.m=m*(1+amp);r.t=t*(1+amp);r.dmg=r.p+r.m+r.t;
    r.raw=r.parts.reduce((a,x)=>a+x.raw,0);
  });
  const curHP=eHP*clamp(S.enHp,1,100)/100;
  return {L,EL,cap,qr,rr,us,es,it,eit,AD,baseAD,bAD,AP,HP,bHP,eHP,eArm,eMR,effA,effM,fA,fM,amp,ampNotes,
    conqOn,stacks,conqPer,isAP,adaptN,rows,curHP,ignOn};
}

function ctl(path,label,min,max,val,fmt){
  return `<div class="ctl"><label>${label}<b data-out="${path}">${fmt?fmt(val):val}</b></label>
    <input type="range" min="${min}" max="${max}" step="1" value="${val}" data-ctl="${path}"></div>`;
}
function rankSeg(key,label,val,cap,auto){
  const btns=[];
  if(auto)btns.push(`<button data-rank="${key}" data-v="-1" class="${val<0?'on':''}">Max</button>`);
  for(let r=auto?1:0;r<=6;r++)btns.push(`<button data-rank="${key}" data-v="${r}" class="${val===r?'on':''}" ${r>cap?'disabled':''}>${r}</button>`);
  return `<div><div class="slot-label" style="margin-top:0">${label}</div><div class="seg">${btns.join('')}</div></div>`;
}

function seg(key,label,opts,val,full){
  return `<div ${full?'style="grid-column:1/-1"':''}><div class="slot-label" style="margin-top:0">${label}</div><div class="seg">${opts.map(([v,t])=>`<button data-seg="${key}" data-v="${v}" class="${String(val)===String(v)?'on':''}">${t}</button>`).join('')}</div></div>`;
}

function renderRanks(){
  const wrap=document.getElementById('rankWrap');if(!wrap)return;
  const S=currentBuild().sim,cap=rankCap(S.myLv);

  wrap.querySelectorAll('[data-rank]').forEach(b=>b.addEventListener('click',()=>{
    S[b.dataset.rank]=+b.dataset.v;saveSoon();renderRanks();updateSimResults();
  }));
}

function updateSimResults(){
  const out=document.getElementById('simOut');if(!out)return;
  const build=currentBuild(),S=build.sim;
  const champ=championMap[state.currentChampion];
  const R=compute(build,state.currentChampion);
  if(!R){out.innerHTML=`<div class="hint warn">${escapeHtml(champ.name)} için stat verisi bulunamadı.</div>`;return;}
  const hint=document.getElementById('rankHint');
  if(hint){
    const used=R.qr+R.rr;const msgs=[];
    if(S.qr>=0&&S.qr>R.cap||S.rr>R.cap)msgs.push(`Bu seviyede rank en fazla ${R.cap} olabilir.`);
    if(used>R.L)msgs.push(`Q ${R.qr} + R ${R.rr} = ${used} yetenek puanı, ama Udyr ${R.L}. seviyede, ${R.L} puanı var.`);
    hint.className='hint'+(msgs.length?' warn':'');hint.textContent=msgs.join(' ');
  }
  const srcTag=s=>s==='wiki'?'<span class="src-tag wiki">Wiki</span>':s==='ddragon'?'<span class="src-tag">Data Dragon</span>':'<span class="src-tag">Sabit</span>';
  const pen=[];
  if(R.it.leth)pen.push(`${nf0.format(R.it.leth)} ölümcüllük`);
  if(R.it.apenF)pen.push(`${pctf(R.it.apenF)} zırh delme`);
  if(R.it.mpen)pen.push(`${nf0.format(R.it.mpen)} büyü delme`);
  if(R.it.mpenF)pen.push(`${pctf(R.it.mpenF)} büyü delme`);
  const counts=S.counts;
  let sum=0;const sumParts={p:0,m:0,t:0};
  R.rows.forEach(r=>{const c=r.off?0:(counts[r.k]||0);if(c){sum+=c*r.dmg;sumParts.p+=c*r.p;sumParts.m+=c*r.m;sumParts.t+=c*r.t;}});
  const anyCount=R.rows.some(r=>!r.off&&counts[r.k]);
  const bar=(r,base)=>{const w=x=>clamp(x/base*100,0,100);return `<div class="dmg-bar"><i style="width:${w(r.p)}%;background:var(--phys)"></i><i style="width:${w(r.m)}%;background:var(--magic)"></i><i style="width:${w(r.t)}%;background:var(--true)"></i></div>`;};
  const pending=state.statSource==='yükleniyor'?' <span class="src-tag">wiki yükleniyor…</span>':'';
  out.innerHTML=`
    <div class="sim-block vs-grid">
      <div class="stat-card">
        <h4>Udyr · Sv ${R.L} ${srcTag(R.us.src)}</h4>
        <dl>
          <dt>AD</dt><dd>${nf0.format(R.AD)} <small>(+${nf0.format(R.bAD)})</small></dd>
          <dt>AP</dt><dd>${nf0.format(R.AP)}</dd>
          <dt>Can</dt><dd>${nf0.format(R.HP)} <small>(+${nf0.format(R.bHP)})</small></dd>
          ${R.conqOn?`<dt>Yenilmez</dt><dd>${R.stacks} st <small>+${nf0.format(R.stacks*R.conqPer)} ${R.isAP?'AP':'AD'}</small></dd>`:''}
          ${pen.length?`<dt>Delme</dt><dd><small>${pen.join(' · ')}</small></dd>`:''}
        </dl>
      </div>
      <div class="stat-card">
        <h4>${escapeHtml(champ.name)} · Sv ${R.EL} ${srcTag(R.es.src)}${pending}</h4>
        <dl>
          <dt>Can</dt><dd>${nf0.format(R.eHP)}${S.enHp<100&&(S.third==='cdg'||S.third==='cut')?` <small>(şu an ${nf0.format(R.curHP)})</small>`:''}</dd>
          <dt>Zırh</dt><dd>${nf0.format(R.eArm)} <small>→ ${nf0.format(R.effA)} · ×${nf2.format(R.fA)}</small></dd>
          <dt>MR</dt><dd>${nf0.format(R.eMR)} <small>→ ${nf0.format(R.effM)} · ×${nf2.format(R.fM)}</small></dd>
          ${R.ampNotes.length?`<dt>Rün</dt><dd><small>${R.ampNotes.join(' · ')}</small></dd>`:''}
        </dl>
      </div>
    </div>
    <div class="legend"><span class="p">Fiziksel</span><span class="m">Büyü</span><span class="t">Gerçek</span><span style="margin-left:auto;letter-spacing:0.08em">Direnç sonrası · vuruş başına</span></div>
    <div id="dmgRows">
      ${R.rows.map(r=>{
        const hits=r.dmg>0?Math.ceil(R.curHP/r.dmg):Infinity;
        const tot=r.total?` · 4 sn: <b style="color:var(--gold-bright)">${nf0.format(r.dmg*r.total)}</b>`:'';
        return `<div class="dmg-row ${r.off?'off':''}">
          <div><div class="dmg-name">${r.name}</div><div class="dmg-sub">${r.off?'Rank 0 — bu yetenek yok':r.sub+tot}</div></div>
          <div class="dmg-val"><div class="big">${r.off?'—':nf0.format(r.dmg)}</div><div class="pct">${r.off?'':pctf(r.dmg/R.eHP)+' · '+(isFinite(hits)?hits+' vuruş':'—')}</div></div>
          <div class="stepper" ${r.off?'style="visibility:hidden"':''}><button data-cnt="${r.k}" data-d="-1" aria-label="azalt">−</button><span>${counts[r.k]||0}</span><button data-cnt="${r.k}" data-d="1" aria-label="arttır">+</button></div>
          ${r.off?'':bar(r,R.eHP)}
        </div>`;}).join('')}
    </div>
    <div class="sum-card">
      ${anyCount?`
        <div class="sum-top">
          <div><div class="slot-label" style="margin:0 0 2px">Seçilenlerin toplamı</div><div class="v">${nf0.format(sum)} <span style="font-size:12px;color:var(--text-dim)">/ ${nf0.format(R.curHP)} can</span></div></div>
          <div style="display:flex;align-items:center;gap:10px"><span class="verdict ${sum>=R.curHP?'kill':'nokill'}">${sum>=R.curHP?'Ölür':'Kalan '+nf0.format(R.curHP-sum)}</span><button class="sum-reset" id="sumReset">Sıfırla</button></div>
        </div>
        <div class="hpbar">${['p','m','t'].map(k=>`<i style="width:${clamp(sumParts[k]/R.curHP*100,0,100)}%;background:var(--${k==='p'?'phys':k==='m'?'magic':'true'})"></i>`).join('')}</div>
        <div class="hint">Fırtına satırlarında sayı tik sayısıdır (4 sn = 8 tik). Rün çarpanları rakibin can yüzdesine göre sabit alınır.</div>`
      :`<div class="hint" style="margin:0">Satırlardaki <b style="color:var(--gold-bright)">+</b> ile vuruş ekle, toplam hasarı rakibin canıyla karşılaştırsın.</div>`}
    </div>
    <div class="hint" style="margin-top:12px">Stat kaynağı: ${R.es.src==='wiki'?'LoL Wiki (Module:ChampionData)':R.es.src==='ddragon'?"Data Dragon — wiki'ye ulaşılamadı":'sabit'}${R.es.patch?' · rakibin son stat değişikliği '+escapeHtml(R.es.patch):''}. Udyr yetenek oranları wiki V26.09. Simülasyon soldaki build'den bağımsızdır. İtem pasifleri hesaba katılmaz, gerekiyorsa "Ek stat"a ekle.</div>`;
  out.querySelectorAll('[data-cnt]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.cnt;counts[k]=clamp((counts[k]||0)+(+b.dataset.d),0,99);if(!counts[k])delete counts[k];saveSoon();updateSimResults();
  }));
  const rs=document.getElementById('sumReset');if(rs)rs.addEventListener('click',()=>{S.counts={};saveSoon();updateSimResults();});
}

function renderPicker(){
  if(!state.picker)return;
  const existing=document.getElementById('pickerModal');
  if(existing)existing.remove();
  const p=state.picker;
  const div=document.createElement('div');
  div.id='pickerModal';div.className='modal-backdrop';
  let lastGroup=null;
  const cells=p.items.map(it=>{
    let head='';
    if(it.group&&it.group!==lastGroup){head=`</div><div class="picker-group" data-group="${escapeHtml(it.group)}">${escapeHtml(it.group)}</div><div class="picker-grid ${p.gridClass||''}">`;lastGroup=it.group;}
    return head+`<div class="picker-item" data-pick="${escapeHtml(it.id)}" data-search="${escapeHtml(it.search||it.name.toLocaleLowerCase('tr'))}" data-g="${escapeHtml(it.group||'')}" title="${escapeHtml(it.title||it.name)}">
      <img src="${it.img}" alt="${escapeHtml(it.name)}" loading="lazy" onerror="this.style.opacity=0.2">${it.label?`<span class="lbl">${escapeHtml(it.label)}</span>`:''}
    </div>`;
  }).join('');
  div.innerHTML=`
    <div class="modal-card ${p.wide?'wide':''}">
      <div class="modal-head">
        <h3>${escapeHtml(p.title)}</h3>
        ${p.onClear?'<button class="back-btn" id="clearPick">Kaldır</button>':''}
        <button class="icon-btn" id="closePicker">×</button>
      </div>
      ${p.search?'<div class="modal-search"><input class="search-input" id="pickSearch" placeholder="Ara..." autocomplete="off"></div>':''}
      <div class="modal-body"><div class="picker-grid ${p.gridClass||''}">${cells}</div></div>
    </div>`;
  document.body.appendChild(div);
  div.querySelectorAll('.picker-grid').forEach(g=>{if(!g.children.length)g.remove();});
  div.querySelector('#closePicker').addEventListener('click',closePicker);
  if(p.onClear)div.querySelector('#clearPick').addEventListener('click',p.onClear);
  div.addEventListener('click',e=>{if(e.target===div)closePicker();});
  div.querySelectorAll('[data-pick]').forEach(el=>{
    el.addEventListener('click',()=>{
      const v=el.dataset.pick;const id=isNaN(+v)?v:+v;
      p.onPick(id);
    });
  });
  const s=div.querySelector('#pickSearch');
  if(s){
    if(window.matchMedia('(hover:hover)').matches)s.focus();
    s.addEventListener('input',()=>{
      const q=s.value.trim().toLocaleLowerCase('tr');
      const shown=new Set();
      div.querySelectorAll('[data-pick]').forEach(el=>{const ok=!q||el.dataset.search.includes(q);el.style.display=ok?'':'none';if(ok)shown.add(el.dataset.g);});
      div.querySelectorAll('.picker-group').forEach(h=>h.style.display=shown.has(h.dataset.group)?'':'none');
    });
  }
}
function closePicker(){state.picker=null;const m=document.getElementById('pickerModal');if(m)m.remove();}

const SYNC_CFG='udyr-codex-sync-v1',GIST_FILE='udyr-codex.json',TOMB_TTL=90*864e5;
const sync={token:null,gistId:null,status:'off',busy:false,dirty:false,err:'',last:0,lastTry:0,pushT:null,pendingView:null};
function loadSyncCfg(){try{const c=JSON.parse(localStorage.getItem(SYNC_CFG)||'null');if(c){sync.token=c.token||null;sync.gistId=c.gistId||null;}}catch(e){}}
function saveSyncCfg(){try{if(sync.token)localStorage.setItem(SYNC_CFG,JSON.stringify({token:sync.token,gistId:sync.gistId}));else localStorage.removeItem(SYNC_CFG)}catch(e){}}
function syncStatusText(){
  if(!sync.token)return 'Bağlı değil — veriler sadece bu cihazda.';
  if(sync.status==='busy')return 'Senkronize ediliyor…';
  if(sync.status==='err')return `<span style="color:var(--danger)">Hata: ${escapeHtml(sync.err)}</span>`;
  return 'Bağlı · son senkron '+(sync.last?new Date(sync.last).toLocaleTimeString('tr-TR'):'—');
}
function setSync(st,err){
  sync.status=st;sync.err=err||'';
  const d=document.getElementById('syncDot');if(d)d.className='sync-dot '+(sync.token?st:'');
  const m=document.getElementById('syncStatus');if(m)m.innerHTML=syncStatusText();
}
function schedulePush(){if(!sync.token)return;clearTimeout(sync.pushT);sync.pushT=setTimeout(syncNow,1500)}
async function gh(path,opts={}){
  const headers={'Authorization':'Bearer '+sync.token,'Accept':'application/vnd.github+json'};
  if(opts.body)headers['Content-Type']='application/json';
  const r=await fetch('https://api.github.com'+path,Object.assign({},opts,{headers,cache:'no-store'}));
  if(!r.ok){const e=new Error(r.status===401?'Token geçersiz veya süresi dolmuş':r.status===403?'Erişim reddedildi (token gist iznine sahip mi?)':'GitHub '+r.status);e.status=r.status;throw e;}
  return r.status===204?null:r.json();
}
function serializeObj(d){
  const o={};
  Object.keys(d||{}).filter(k=>k!=='__deleted').sort().forEach(k=>{
    const b=((d[k]&&d[k].builds)||[]).filter(x=>x&&x.id&&x.u);
    if(b.length)o[k]={builds:b};
  });
  const del=d&&d.__deleted;
  if(del&&Object.keys(del).length){o.__deleted={};Object.keys(del).sort().forEach(k=>o.__deleted[k]=del[k]);}
  return JSON.stringify(o);
}
async function findOrCreateGist(){
  for(let page=1;page<=10;page++){
    const list=await gh(`/gists?per_page=100&page=${page}`);
    const g=list.find(g=>g.files&&g.files[GIST_FILE]);
    if(g)return g.id;
    if(list.length<100)break;
  }
  const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Udyr Codex senkron verisi',public:false,files:{[GIST_FILE]:{content:serializeObj(state.data)}}})});
  return g.id;
}
async function pullRemote(){
  const g=await gh('/gists/'+sync.gistId);
  const f=g.files&&g.files[GIST_FILE];if(!f)return {};
  let txt=f.content;
  if(f.truncated)txt=await (await fetch(f.raw_url,{cache:'no-store'})).text();
  try{const o=JSON.parse(txt);return o&&typeof o==='object'?o:{}}catch(e){return {}}
}
// Build bazında birleştirme: aynı id'de daha yeni (u) olan kazanır; silme izi daha yeniyse build düşer.
function mergeInto(remote){
  const now=Date.now();
  const del=state.data.__deleted||(state.data.__deleted={});
  Object.entries(remote.__deleted||{}).forEach(([k,v])=>{if(!(del[k]>=v))del[k]=v});
  Object.keys(del).forEach(k=>{if(now-del[k]>TOMB_TTL)delete del[k]});
  const keys=new Set([...Object.keys(state.data),...Object.keys(remote)]);keys.delete('__deleted');
  keys.forEach(k=>{
    const loc=state.data[k];
    const la=(loc&&loc.builds)||[],lb=(remote[k]&&remote[k].builds)||[];
    const map=new Map(),order=[];
    la.concat(lb).forEach(x=>{
      if(!x||!x.id)return;
      const c=map.get(x.id);
      if(!c){map.set(x.id,x);order.push(x.id);}
      else if((x.u||0)>(c.u||0))map.set(x.id,x);
    });
    const builds=order.map(id=>map.get(id)).filter(x=>!(del[x.id]&&del[x.id]>=(x.u||0)));
    builds.forEach(ensureBuild);
    if(loc)loc.builds=builds;else if(builds.length)state.data[k]={builds};
  });
}
function uiBusy(){
  const ae=document.activeElement;
  return !!(document.getElementById('pickerModal')||(ae&&(ae.tagName==='TEXTAREA'||(ae.tagName==='INPUT'&&ae.type!=='range'))));
}
function refreshView(curId){
  if(uiBusy()){sync.pendingView={id:curId};return;}
  sync.pendingView=null;
  if(state.currentChampion){
    const d=ensureChampData(state.currentChampion);
    const i=d.builds.findIndex(b=>b.id===curId);
    state.currentBuildIdx=i>=0?i:Math.min(state.currentBuildIdx,d.builds.length-1);
    renderMatchup();
  }else if(document.getElementById('champGrid'))renderChampionGrid();
}
async function syncNow(){
  if(!sync.token)return;
  if(sync.busy){sync.dirty=true;return;}
  clearTimeout(sync.pushT);
  sync.busy=true;sync.dirty=false;sync.lastTry=Date.now();setSync('busy');
  try{
    if(!sync.gistId){sync.gistId=await findOrCreateGist();saveSyncCfg();}
    const remote=await pullRemote();
    const curId=(currentBuild()||{}).id;
    const before=JSON.stringify(state.data);
    mergeInto(remote);
    if(JSON.stringify(state.data)!==before){persist();refreshView(curId);}
    const mine=serializeObj(state.data);
    if(mine!==serializeObj(remote))await gh('/gists/'+sync.gistId,{method:'PATCH',body:JSON.stringify({files:{[GIST_FILE]:{content:mine}}})});
    sync.last=Date.now();setSync('ok');
  }catch(e){
    console.warn('sync',e);
    if(e.status===404){sync.gistId=null;saveSyncCfg();}
    setSync('err',e.message||'Bağlantı hatası');
  }finally{
    sync.busy=false;
    if(sync.dirty)setTimeout(syncNow,300);
  }
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&sync.token)syncNow()});
setInterval(()=>{
  if(document.visibilityState!=='visible'||!sync.token)return;
  if(sync.pendingView&&!uiBusy())refreshView(sync.pendingView.id);
  if(!sync.busy&&Date.now()-sync.lastTry>30000)syncNow();
},5000);

function closeSyncModal(){const m=document.getElementById('syncModal');if(m)m.remove()}
function openSyncModal(){
  closeSyncModal();
  const div=document.createElement('div');div.id='syncModal';div.className='modal-backdrop';
  const on=!!sync.token;
  div.innerHTML=`
    <div class="modal-card">
      <div class="modal-head"><h3>Senkronizasyon</h3><button class="icon-btn" id="syncClose">×</button></div>
      <div class="modal-body sync-body">
        <div class="sync-status" id="syncStatus">${syncStatusText()}</div>
        ${on?`
          <p>Build'ler ve notlar GitHub hesabındaki gizli bir gist'te tutuluyor. Değişiklikler birkaç saniye içinde gönderilir. Diğer cihaz 30 saniyede bir ve sayfaya her döndüğünde günceller.</p>
          <div class="sync-row"><button class="btn" id="syncNowBtn">Şimdi senkronize et</button><button class="btn ghost" id="syncOff">Bağlantıyı kes</button></div>`
        :`
          <p>PC ve telefonda aynı veriyi görmek için build'ler GitHub hesabındaki gizli bir gist'e kaydedilir. Bir token oluşturup iki cihaza da girmen yeterli.</p>
          <ol>
            <li><a href="https://github.com/settings/tokens/new?scopes=gist&description=Udyr%20Codex" target="_blank" rel="noopener">Bu bağlantıyla</a> GitHub'da yeni token sayfasını aç. Sadece <b>gist</b> izni seçili gelir.</li>
            <li><b>Expiration</b>'ı istediğin süreye ayarla, en alttaki <b>Generate token</b>'a bas.</li>
            <li>Çıkan <code>ghp_…</code> kodunu kopyalayıp aşağıya yapıştır. Diğer cihazda da aynı kodu gir.</li>
          </ol>
          <input class="search-input" id="syncToken" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false">
          <div class="sync-row"><button class="btn" id="syncConnect">Bağlan</button></div>
          <p style="margin-top:12px;font-size:11px">Token sadece bu tarayıcıda saklanır ve yalnızca gist'lere erişebilir. İki cihazdaki veriler ilk bağlantıda birleştirilir, hiçbiri silinmez.</p>`}
      </div>
    </div>`;
  document.body.appendChild(div);
  div.querySelector('#syncClose').addEventListener('click',closeSyncModal);
  div.addEventListener('click',e=>{if(e.target===div)closeSyncModal()});
  if(on){
    div.querySelector('#syncNowBtn').addEventListener('click',()=>syncNow());
    div.querySelector('#syncOff').addEventListener('click',()=>{
      if(!confirm('Senkronizasyon kapatılsın mı? Veriler bu cihazda kalır.'))return;
      sync.token=null;sync.gistId=null;saveSyncCfg();setSync('off');openSyncModal();
    });
  }else{
    const btn=div.querySelector('#syncConnect');
    btn.addEventListener('click',async()=>{
      const t=div.querySelector('#syncToken').value.trim();
      if(!t){toast('Token boş');return;}
      btn.disabled=true;const prev=sync.token;sync.token=t;
      try{await gh('/user');}
      catch(e){sync.token=prev;btn.disabled=false;const m=div.querySelector('#syncStatus');m.innerHTML=`<span style="color:var(--danger)">${escapeHtml(e.message||'Bağlanılamadı')}</span>`;return;}
      sync.gistId=null;saveSyncCfg();openSyncModal();await syncNow();toast(sync.status==='ok'?'Senkronize edildi':'Senkron hatası');
    });
  }
}
document.getElementById('syncBtn').addEventListener('click',openSyncModal);

/* ================= JSON YEDEK ================= */
document.getElementById('exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`udyr-codex-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);toast('Dışa aktarıldı');
});
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      if(confirm('Mevcut veriler değişecek. Devam?')){
        const now=Date.now();
        state.data=parsed&&typeof parsed==='object'?parsed:{};
        if(!state.data.__deleted)state.data.__deleted={};
        eachBuild(state.data,b=>{b.u=now});
        persist();schedulePush();toast('İçe aktarıldı');
        if(state.currentChampion){ensureChampData(state.currentChampion);renderMatchup();}else renderSelection();
      }
    }catch(err){toast('Geçersiz JSON');}
  };
  r.readAsText(f);e.target.value='';
});

bootstrap();
</script>
